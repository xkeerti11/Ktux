  <path d="M50 11 C50 12.5 51.5 13.5 53 13.5 C51.5 13.5 50 14.5 50 16 C50 14.5 48.5 13.5 47 13.5 C48.5 13.5 50 12.5 50 11 Z" fill="#FACC15" />
