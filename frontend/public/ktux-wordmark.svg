<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" fill="none" role="img" aria-label="KTUX Logo">
  <defs>
    <linearGradient id="ktux-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="ktux-sparkle-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Letter K -->
  <g fill="currentColor">
    <!-- K Vertical Stem -->
    <path d="M12 9H20V45H12V9Z" />
    <!-- K Upper Diagonal Arm -->
    <path d="M37 9H47L29.5 28.5L20 28.5L37 9Z" />
    <!-- K Lower Diagonal Leg -->
    <path d="M23.5 25.5L40 45H49.5L30.5 25.5H23.5Z" />
  </g>

  <!-- Letter T -->
  <g fill="currentColor">
    <!-- T Top Bar -->
    <path d="M57 9H95V16.5H79.8V45H72.2V16.5H57V9Z" />
  </g>

  <!-- Letter U -->
  <g fill="currentColor">
    <!-- U Left + Right Stems with smooth bottom curve -->
    <path d="M103 9H110.8V34C110.8 38.2 113.2 40 119.5 40C125.8 40 128.2 38.2 128.2 34V9H136V34C136 42.5 129.5 45.8 119.5 45.8C109.5 45.8 103 42.5 103 34V9Z" />
  </g>

  <!-- Letter X -->
  <g fill="currentColor">
    <!-- X Crossing Diagonals -->
    <path d="M144 9H153.5L163.5 23.5L173.5 9H183L168.8 27L184 45H174.5L163.5 30.5L152.5 45H143L158.2 27L144 9Z" />
  </g>

  <!-- Luxury Diamond Sparkle Accent -->
  <g transform="translate(194, 8)" filter="url(#glow)">
    <path d="M8 0 C8 5 13 8 16 8 C13 8 8 11 8 16 C8 11 3 8 0 8 C3 8 8 5 8 0 Z" fill="#FACC15" />
    <circle cx="8" cy="8" r="1.5" fill="#FFFFFF" />
  </g>
</svg>
