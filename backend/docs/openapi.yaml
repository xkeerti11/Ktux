openapi: 3.1.0
info:
  title: Ktux API
  version: 0.1.0
  description: Backend API for the Ktux agency website, lead pipeline, content, and consultation booking.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Leads
  - name: Content
  - name: Consultations
  - name: AI
paths:
  /auth/login:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200': { description: Authenticated }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      responses:
        '200': { description: Refreshed access token }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      responses:
        '204': { description: Logged out }
  /leads:
    post:
      tags: [Leads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadRequest'
      responses:
        '201': { description: Lead created }
        '400': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Leads]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated leads }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /consultations/webhook:
    post:
      tags: [Consultations]
      parameters:
        - { name: x-zapier-webhook-secret, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalComWebhook'
      responses:
        '200': { description: Booking processed idempotently }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /ai/chat:
    post:
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                sessionId: { type: string, format: uuid }
                message: { type: string, maxLength: 4000 }
      responses:
        '200': { description: Assistant response }
  /ai/audit:
    post:
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        '200': { description: Audit result }
        '400': { description: Unsafe URL }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    LeadRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email }
        phone: { type: string }
        company: { type: string }
        industry: { type: string }
        serviceInterested: { type: array, items: { type: string } }
        message: { type: string, maxLength: 5000 }
    CalComWebhook:
      type: object
      required: [calComId, clientName, clientEmail, serviceType, bookingDateTime]
      properties:
        calComId: { type: string }
        clientName: { type: string }
        clientEmail: { type: string, format: email }
        clientPhone: { type: string }
        serviceType: { type: string }
        bookingDateTime: { type: string, format: date-time }
        meetingLink: { type: string }
        status: { type: string, enum: [scheduled, completed, cancelled] }
        notes: { type: string }
  responses:
    ValidationError:
      description: Validation error
    Unauthorized:
      description: Authentication required
